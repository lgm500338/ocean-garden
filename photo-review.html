.card.out{border-color:var(--out)}

.bar b{color:var(--fg)}
button.main{background:var(--accent);color:#02261f;border:0;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid #2a5570;border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lb{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:9}
.lb img{max-height:92vh;max-width:94vw;border-radius:8px}
.lb span{position:absolute;top:14px;left:16px;font-weight:800;font-size:18px}

const KEY='og-photo-review-out';
let out=new Set();try{out=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const url=(id,w,h)=>`https://images.unsplash.com/photo-${id}?w=${w}&h=${h}&fit=crop&q=60&auto=format`;
const grid=document.getElementById('grid');document.getElementById('total').textContent=DATA.length;
DATA.forEach(([id,alt],i)=>{const n=i+1;const d=document.createElement('div');d.className='card'+(out.has(n)?' out':'');d.tabIndex=0;d.title=alt;
d.innerHTML=`<img loading="lazy" alt="" src="${url(id,320,569)}"><span class="num">${n}</span><button class="zoom" aria-label="크게 보기">🔍</button>`;
d.querySelector('img').onerror=()=>d.classList.add('err');
const tog=()=>{out.has(n)?out.delete(n):out.add(n);d.classList.toggle('out');save()};
d.onclick=e=>{if(e.target.closest('.zoom')){e.stopPropagation();lb(id,n);return}tog()};
d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}};grid.appendChild(d)});
function list(){return[...out].sort((a,b)=>a-b)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(list()))}catch(e){}const l=list();document.getElementById('txt').innerHTML=l.length?`<b>빼기 ${l.length}장</b> · 넣기 ${DATA.length-l.length}장<br>${l.join(', ')}`:`<b>빼기 0장</b> · 모두 넣기`}
save();
document.getElementById('clear').onclick=()=>{out.clear();document.querySelectorAll('.card.out').forEach(c=>c.classList.remove('out'));save()};
document.getElementById('copy').onclick=async()=>{const t='빼기: '+(list().join(', ')||'없음');const b=document.getElementById('copy');try{await navigator.clipboard.writeText(t);b.textContent='복사됐어요'}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('txt'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='선택됐어요, Ctrl+C'}setTimeout(()=>b.textContent='번호 복사',1800)};
function lb(id,n){const o=document.createElement('div');o.className='lb';o.innerHTML=`<span>${n}번</span><img src="${url(id,720,1280)}" alt="">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
</script></body></html>
